<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .profile-img {
            width: 270px;
            height: 300px;
            object-fit: cover;
        }

        .follow-button {
            background-color: rgb(24, 151, 255);
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 7px;
            padding-bottom: 7px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .username {
            color:rgb(84, 84, 84)
        }

        .card {
            margin-left: 20px;
            display: inline-block;
            background-color: white;
            box-shadow: 0px 0px 10px black;
            padding-bottom: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .username, h3, .followers,
        .follow-button {
            margin-left: 10px;
        }
    </style>
</head>
<body>


    <!--Card Template-->
    <div class="card">

        <img src="duffy.gif" class="profile-img">
        <h3>Duffy</h3>
        <p class="username">@duffy_duck</p>
        <p class="followers">300K Followers</p>
        <button class="follow-button">
            Follow
        </button>

    </div>


    <!--Card Template-->
    <div class="card">

        <img src="bug-bunny.jpg" class="profile-img">
        <h3>Bugs Bunny</h3>
        <p class="username">@bugs_bunnyk</p>
        <p class="followers">1M Followers</p>
        <button class="follow-button">
            Follow
        </button>

    </div>


    <!--Card Template-->
    <div class="card">

        <img src="rick.jpg" class="profile-img">
        <h3>Rick Sanchez</h3>
        <p class="username">@rick_sanchez</p>
        <p class="followers">4M Followers</p>
        <button class="follow-button">
            Follow
        </button>

    </div>
    

    


    
</body>
</html>
