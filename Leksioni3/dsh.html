<!DOCTYPE html>
<html lang="en">
<head>
    <title>Detyre shtepie</title>
    <style>
        .butoni1 {
            background-color: rgb(85, 68, 246);
            color: white;
            border: none;
            border-radius: 20px;
            width: 100px;
            height: 28px;
            cursor: pointer;
        }

        .save-button {
            background-color: transparent;
            width: 70px;
            height: 28px;
            border-radius: 20px;
            border: 1px solid rgb(85, 68, 246);
            color: rgb(85, 68, 246);
           
        }

        .cancel-button{
            background-color: transparent;
            width: 70px;
            height: 28px;
            border-radius: 20px;
            border: 1px solid rgb(255, 55, 0);
            color: rgb(255, 55, 0);
           
        }


        .cmimi {
            color: green;
        }

        .posta {
            color: blue;
        }

        .shto-ne-shporte{
            background-color: goldenrod;
            border: none;
            border-radius: 20px;
            width: 120px;
            height: 28px;
            cursor: pointer;
        }


    </style>

</head>
<body>

    <button class="butoni1">
        Button
    </button>

    <br><br><!--Break Line-->

    <button class="save-button">Save</button>

    <button class="cancel-button">Cancel</button>


    <h1>iPhone 18 pro max</h1>
    <p class="cmimi">$1000</p>
    <p class="posta">Posta falas</p>
    <button class="shto-ne-shporte">
        Shto ne shporte
    </button>

    
</body>
</html>
