<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>

    <style>
        .click-me {
            background-color: rgb(0, 76, 255);
            color: white;
            border: none;
            width: 90px;
            height: 28px;
            border-radius: 20px;
            cursor:pointer;
            transition: 0.2s;
        }

        .click-me:hover{
            opacity: 0.7;
        }

        .click-me:active{
            opacity: 0.4;
        }


        .download-button {
            background-color: transparent;
            border: 2px solid rgb(27, 188, 27);
            color: rgb(27, 188, 27);
            cursor: pointer;
            border-radius: 10px;
            width: 100px;
            height: 28px;
            transition: 0.2s;
        }

        .download-button:hover {
            background-color: rgb(27, 188, 27);
            color: white;
        }

        .shadow-button{
            background-color: orange;
            border: none;
            width: 70px;
            height: 28px;
            border-radius: 20px;
            cursor: pointer;
            transition: 1s;
            
        }

        .shadow-button:hover{
            box-shadow: 5px 5px 5px black;
        }

    </style>
</head>
<body>

    <button  class="click-me">
        Click me
    </button>

    <button class="download-button">
        Download
    </button>

    <button class="shadow-button">
        Shadow
    </button>
    
</body>
</html>
