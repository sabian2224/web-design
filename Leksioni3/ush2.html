<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .butoni2{
            background-color: rgb(86, 43, 226);
            color: white;
            border-radius: 5px;
            border: 1px solid rgb(86, 43, 226);
            transition: 0.5s;
            cursor: pointer;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .butoni2:hover {
            padding-left: 25px;
            padding-right: 25px;
            padding-top: 7px;
            padding-bottom: 7px;

            background-color: transparent;
            color: rgb(86, 43, 226);
            box-shadow: 0px 0px 5px rgb(86, 43, 226);
        }

        .butoni2:active {
            box-shadow: 0px 0px 15px rgb(86, 43, 226);
        }

        .butoni3 {
            background-color: lightblue;
            border: none;
            padding: 7px;
            border-radius: 3px;
            transition: 1s;
            cursor: pointer;
            box-shadow: 4px 4px 4px rgb(146, 184, 197);
        }

        .butoni3:active{
            margin-left: 4px;
            margin-top: 4px;
            box-shadow: none;
        }
    </style>
</head>
<body>

    
    <button class="butoni2">
        Download
    </button>
    <br><br>

    <button class="butoni3">
        3D Button
    </button>
</body>
</html>
